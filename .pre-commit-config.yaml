default_install_hook_types:
  - commit-msg
  - pre-push
  - post-checkout

repos:
  - repo: local
    hooks:
      - id: check-branch-name
        name: Check branch name
        entry: |
          bash -c '
            branch=$(git rev-parse --abbrev-ref HEAD)
            pattern="^(feature|bugfix|hotfix|refactor|chore|docs|test|experiment|release)/[a-z0-9._-]+$"
            if [[ "$branch" == "main" || "$branch" == "master" || "$branch" == "dev" ]]; then
              exit 0
            fi
            if [[ ! "$branch" =~ $pattern ]]; then
              echo "Branch name \"$branch\" does not match pattern: $pattern"
              echo "Examples: feature/add-login, bugfix/fix-auth, hotfix/security-patch"
              exit 1
            fi
          '
        language: system
        stages: [pre-push, post-checkout]
        always_run: true
        pass_filenames: false

      - id: check-commit-msg
        name: Check commit message format
        entry: |
          bash -c '
            commit_msg=$(cat "$1")
            pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,50}"
            if [[ ! "$commit_msg" =~ $pattern ]]; then
              echo "Commit message does not follow conventional format!"
              echo "Format: <type>(<scope>): <description>"
              echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              echo "Example: feat(auth): add login endpoint"
              echo ""
              echo "Your message: $commit_msg"
              exit 1
            fi
          ' --
        language: system
        stages: [commit-msg]
        always_run: true
