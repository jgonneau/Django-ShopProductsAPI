services:
  db:
    image: postgres:16-alpine
    container_name: shop_products_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_products}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shop_products}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: shop_products_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ShopProductsAPI:/app/ShopProductsAPI
    env_file:
      - ./ShopProductsAPI/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
