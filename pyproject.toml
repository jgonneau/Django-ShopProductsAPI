[project]
name = "shop-products-api"
dynamic = ["version"]
description = "Django REST API for shop products"
readme = "README.md"
requires-python = ">=3.10"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["ShopProductsAPI/shop_products_api/__init__.py:__version__"]
upload_to_pypi = false
upload_to_release = true
build_command = ""
commit_message = "chore(release): bump version to {version}"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
